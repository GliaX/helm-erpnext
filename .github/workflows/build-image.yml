name: build-image

# Build and publish the custom ERPNext+Frappe CRM image whenever the Dockerfile
# changes (or on manual dispatch). The Actions GITHUB_TOKEN has packages:write,
# so no extra secrets are needed.

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".github/workflows/build-image.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            CRM_REPO=https://github.com/tareko/crm.git
            CRM_BRANCH=fix-assign-to-v1.x
          push: true
          tags: |
            ghcr.io/gliax/erpnext:v16.4.1-crm-v1.80.0-fix
            ghcr.io/gliax/erpnext:latest-crm
          cache-from: type=gha
          cache-to: type=gha,mode=max
