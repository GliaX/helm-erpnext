apiVersion: v2
name: helm-erpnext
description: |
  Glia's ERPNext deployment (asset.glia.org) as Helm-as-Code. Wraps the upstream
  frappe/erpnext chart and pins it to the currently-deployed version.
type: application
version: 0.1.0
appVersion: "v16.4.1"
maintainers:
  - name: Glia
    url: https://github.com/GliaX
dependencies:
  - name: erpnext
    version: "8.0.21"   # chart version currently deployed (app v16.4.1); bump deliberately
    repository: https://helm.erpnext.com
