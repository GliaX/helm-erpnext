# ERPNext backup: dump, verify, copy off-cluster to TWO providers, prune, and
# write a status marker that the in-app health check reads.
#
# Why this exists: until 2026-11-15 there was no automated backup at all and
# sites/ lived on a single RWO DigitalOcean volume, so losing the node/PVC lost
# the store.
#
# Each run (every 6 hours, and twice a day it lands inside business hours):
#   - `bench --site asset.glia.org backup --with-files` on the PVC
#   - gzip -t / tar -tf integrity checks
#   - copy #1: Nextcloud WebDAV (off-cluster droplet)
#   - copy #2: DigitalOcean Spaces, S3 API, independent provider (mirror)
#   - prune: 14 days on the PVC, 120 days on both remote copies
#   - write sites/<site>/private/backups/last_run.json (ok/failed + stage)
#
# Credentials (created out of band, never committed):
#   kubectl -n erpnext create secret generic erpnext-backup-nextcloud \
#     --from-literal=NC_URL=https://cloud.glia.org \
#     --from-literal=NC_USER=tloubani \
#     --from-literal=NC_PASS=<app password>
#   # copy #2 — a DEDICATED bucket with its own bucket-scoped key. Never the
#   # shared Mattermost bucket (the script refuses `glia-group` outright).
#   # Bucket: glia-erpnext-backups (nyc3, private)
#   # Key:    glia-erpnext-backup, grant bucket=glia-erpnext-backups;permission=readwrite
#   kubectl -n erpnext create secret generic erpnext-backup-spaces \
#     --from-literal=SPACES_ENDPOINT=https://nyc3.digitaloceanspaces.com \
#     --from-literal=SPACES_REGION=nyc3 \
#     --from-literal=SPACES_BUCKET=glia-erpnext-backups \
#     --from-literal=SPACES_PREFIX= \
#     --from-literal=SPACES_KEY=<access key> \
#     --from-literal=SPACES_SECRET=<secret key>
#
# Scripts (source of truth in this repo):
#   kubectl -n erpnext create configmap erpnext-backup-scripts \
#     --from-file=backup/backup.sh --from-file=backup/spaces.py \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# Apply / run / watch:
#   kubectl apply -f backup/erpnext-backup-cronjob.yaml
#   kubectl -n erpnext create job --from=cronjob/erpnext-backup erpnext-backup-manual-$(date +%H%M)
#   kubectl -n erpnext logs -f job/<job-name>
#
# Alerting: backup/health_check.py (installed as a Server Script scheduler event)
# emails info@glia.org when the marker is missing, failed or older than 26h.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: erpnext-backup
  namespace: erpnext
  labels:
    app.kubernetes.io/name: erpnext
    app.kubernetes.io/component: backup
spec:
  schedule: "30 */6 * * *"
  timeZone: "America/Toronto"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 7200
      ttlSecondsAfterFinished: 1209600   # keep finished jobs 14 days
      template:
        metadata:
          labels:
            app.kubernetes.io/name: erpnext
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: Never
          # The sites PVC is ReadWriteOnce (DO block storage). Pods on the same
          # node share it; a pod on the other node would hang on multi-attach.
          nodeSelector:
            glia.workload: erpnext
          securityContext:
            supplementalGroups: [1000]
          containers:
            - name: backup
              image: ghcr.io/gliax/erpnext:v16.30.0-crm-v1.80.0-emailbuilder5-guestcheckout11-donations9-ops13
              command: ["bash", "/opt/glia-backup/backup.sh"]
              env:
                - name: NC_URL
                  valueFrom:
                    secretKeyRef: {name: erpnext-backup-nextcloud, key: NC_URL}
                - name: NC_USER
                  valueFrom:
                    secretKeyRef: {name: erpnext-backup-nextcloud, key: NC_USER}
                - name: NC_PASS
                  valueFrom:
                    secretKeyRef: {name: erpnext-backup-nextcloud, key: NC_PASS}
                - name: SPACES_ENDPOINT
                  valueFrom:
                    secretKeyRef: {name: erpnext-backup-spaces, key: SPACES_ENDPOINT}
                - name: SPACES_REGION
                  valueFrom:
                    secretKeyRef: {name: erpnext-backup-spaces, key: SPACES_REGION}
                - name: SPACES_BUCKET
                  valueFrom:
                    secretKeyRef: {name: erpnext-backup-spaces, key: SPACES_BUCKET}
                - name: SPACES_KEY
                  valueFrom:
                    secretKeyRef: {name: erpnext-backup-spaces, key: SPACES_KEY}
                - name: SPACES_SECRET
                  valueFrom:
                    secretKeyRef: {name: erpnext-backup-spaces, key: SPACES_SECRET}
                - name: SPACES_PREFIX
                  valueFrom:
                    secretKeyRef: {name: erpnext-backup-spaces, key: SPACES_PREFIX}
                - name: LOCAL_KEEP_DAYS
                  value: "14"
                - name: REMOTE_KEEP_DAYS
                  value: "120"
              resources:
                requests: {cpu: 100m, memory: 512Mi}
                limits: {cpu: "2", memory: 3Gi}
              volumeMounts:
                - name: sites-dir
                  mountPath: /home/frappe/frappe-bench/sites
                - name: scripts
                  mountPath: /opt/glia-backup
          volumes:
            - name: sites-dir
              persistentVolumeClaim:
                claimName: erpnext
            - name: scripts
              configMap:
                name: erpnext-backup-scripts
                defaultMode: 0555
