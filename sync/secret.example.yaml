# Template for the sync Secret. Copy to secret.yaml (gitignored) and fill in.
#   cp secret.example.yaml secret.yaml
# Deploy with: kubectl apply -f sync/secret.yaml
#
# Source: the same values as glia-shopify-erpnext/.env
# (Shopify Dev Dashboard app + ERPNext API user).
apiVersion: v1
kind: Secret
metadata:
  name: glia-sync-secrets
  namespace: erpnext
type: Opaque
stringData:
  SHOPIFY_SHOP_DOMAIN: glia2.myshopify.com
  SHOPIFY_CLIENT_ID: "<Dev Dashboard Client ID>"
  SHOPIFY_CLIENT_SECRET: "<Dev Dashboard Client Secret>"
  SHOPIFY_API_VERSION: "2025-07"
  ERPNEXT_BASE_URL: https://asset.glia.org
  ERPNEXT_API_KEY: "<ERPNext API Key>"
  ERPNEXT_API_SECRET: "<ERPNext API Secret>"
