# ---------------------------------------------------------------------------
# Template for the gitignored secrets overlay. Copy to values.secret.yaml and
# fill in real values. NEVER commit values.secret.yaml.
#
#   cp values.secret.example.yaml values.secret.yaml
#
# Deploy/upgrade with BOTH files:
#   helm dep update .
#   helm -n erpnext upgrade --install erpnext . -f values.yaml -f values.secret.yaml
#
# Source of truth for the current values: the running cluster. If you don't have
# them recorded, recover from kubectl before rotating.
# ---------------------------------------------------------------------------

# ERPNext site "Administrator" password (jobs.createSite.adminPassword).
createSite:
  adminPassword: "REPLACE_ME"

# MariaDB (in-cluster statefulset) root password. MUST match the existing DB
# or you'll be locked out / the upgrade will fail to connect.
mariadb-sts:
  rootPassword: "REPLACE_ME"

# PostgreSQL subchart password. Currently unused (dbType=mariadb) but the
# subchart field exists, so we keep it in sync to avoid drift.
postgresql:
  postgresPassword: "REPLACE_ME"
